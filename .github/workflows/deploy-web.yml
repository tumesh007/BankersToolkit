name: Deploy Web App to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build WebAssembly Web App
        run: |
          cd source
          ./gradlew :cmp-web:wasmJsBrowserDistribution --no-daemon -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseG1GC"

      - name: Verify Distribution Output
        run: |
          ls -la source/cmp-web/build/dist/wasmJs/productionExecutable/

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/cmp-web/build/dist/wasmJs/productionExecutable/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
